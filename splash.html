<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppHub Chargement</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loader {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }

        .loader::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: #646cff;
            border-radius: 2px;
            animation: load 1.5s infinite ease-in-out;
        }

        .status {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(100, 108, 255, 0.4);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(100, 108, 255, 0.4);
            }
        }

        @keyframes load {
            0% {
                left: -50%;
            }

            100% {
                left: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="splash-container">
        <div class="logo">
            <img src="./src/logo.png" alt="AppHub Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h1>AppHub</h1>
        <div class="loader"></div>
        <div class="status">Initialisation...</div>
    </div>
</body>

</html>
